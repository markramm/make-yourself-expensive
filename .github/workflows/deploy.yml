name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pin npm explicitly. node 22 currently bundles npm 10.9.8, but that moves with
      # patch releases, and npm 10 and 11 resolve optional platform binaries (the
      # @emnapi/* and @img/sharp-* families) into different lockfile layouts. An
      # unpinned npm meant a lockfile generated locally could be rejected here with
      # "Missing: @emnapi/core@... from lock file" even though it verified fine on the
      # author's machine. Regenerate the lockfile with this same version.
      - run: npm i -g npm@10.9.8
      - run: npm ci
      - run: npm test
      - run: npx astro check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pin npm explicitly. node 22 currently bundles npm 10.9.8, but that moves with
      # patch releases, and npm 10 and 11 resolve optional platform binaries (the
      # @emnapi/* and @img/sharp-* families) into different lockfile layouts. An
      # unpinned npm meant a lockfile generated locally could be rejected here with
      # "Missing: @emnapi/core@... from lock file" even though it verified fine on the
      # author's machine. Regenerate the lockfile with this same version.
      - run: npm i -g npm@10.9.8
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
