name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Corepack honours the "packageManager" field in package.json, so CI and every
      # contributor's machine use the same npm. node 22 bundles whichever npm 10.9.x
      # came with the patch the runner resolved, and npm 10 and 11 lay out optional
      # platform binaries (the @emnapi/* and @img/sharp-* families) differently -- a
      # lockfile written by npm 11 is rejected here with "Missing: @emnapi/core@...
      # from lock file" however carefully it was verified locally. Pinning one version
      # in package.json fixes both sides of that, not just this one.
      - run: corepack enable
      - run: npm ci
      - run: npm test
      - run: npx astro check

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Corepack honours the "packageManager" field in package.json, so CI and every
      # contributor's machine use the same npm. node 22 bundles whichever npm 10.9.x
      # came with the patch the runner resolved, and npm 10 and 11 lay out optional
      # platform binaries (the @emnapi/* and @img/sharp-* families) differently -- a
      # lockfile written by npm 11 is rejected here with "Missing: @emnapi/core@...
      # from lock file" however carefully it was verified locally. Pinning one version
      # in package.json fixes both sides of that, not just this one.
      - run: corepack enable
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Never publish from a pull_request run -- PRs exist to prove the build, not to
    # push an unreviewed branch to the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
